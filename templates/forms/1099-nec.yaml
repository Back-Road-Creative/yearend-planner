# Form 1099-NEC: nonemployee compensation (Schedule C receipts).
form: 1099-NEC
years: [2024, 2025, 2026]
match: ["1099-NEC"]
boxes:
  "1": {label: "Nonemployee compensation", pattern: '\b1 Nonemployee compensation\s+AMOUNT', required: true}
  "4": {label: "Federal income tax withheld", pattern: '\b4 Federal income tax withheld\s+AMOUNT'}
