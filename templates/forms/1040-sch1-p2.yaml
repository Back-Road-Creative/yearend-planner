# Schedule 1 (Form 1040) page 2 (Part II, adjustments). Merges with page 1.
form: 1040-SCH1
years: [2024, 2025, 2026]
match: ["Schedule 1 (Form 1040)", "Educator expenses"]
year_pattern: 'Schedule 1 \(Form 1040\)\s*(20\d\d)'
issuer: self
return: true
boxes:
  "15": {label: "Deductible part of SE tax", pattern: 'Deductible part of self-employment tax[^\n]*?\b15\s+AMOUNT'}
  "16": {label: "SEP, SIMPLE, qualified plans", pattern: 'Self-employed SEP, SIMPLE, and qualified plans[\s.]*16\s+AMOUNT'}
  "17": {label: "SE health insurance deduction", pattern: '\b17 Self-employed [^\n]*?\b17\s+AMOUNT'}
  "20": {label: "IRA deduction", pattern: 'IRA deduction[\s.]*20\s+AMOUNT'}
  "26": {label: "Adjustments to income", pattern: 'These are your adjustments to income[^\n]*\n?[^\n]*?\b26\s+AMOUNT', required: true}
