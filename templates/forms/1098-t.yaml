# Form 1098-T, Tuition Statement: the payments a school received for qualified
# tuition and related expenses (box 1) and the scholarships or grants it
# administered (box 5), which Form 8863's adjusted expenses start from (the
# education answer is typed per student; these are its cross-check).
form: 1098-T
years: [2024, 2025, 2026]
match: ["1098-T", "Tuition Statement"]
year_pattern: "(?:Tuition Statement\\s*|calendar year\\s*:?\\s*)(20\\d\\d)"
issuer_pattern: "FILER'?S name(?:, street address[^:\\n]*)?:?\\s*([^\\n]+)"
boxes:
  "1": {label: "Payments received for qualified tuition and related expenses", pattern: '\b1 Payments received for qualified tuition and related expenses\s+AMOUNT'}
  "5": {label: "Scholarships or grants", pattern: '\b5 Scholarships or grants\s+AMOUNT'}
