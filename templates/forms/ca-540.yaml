# California Form 540, Side 2 (income, deductions, tax). Sides 3-5 are
# ca-540-p3/p4/p5.yaml; every side merges as form CA-540. Labels follow the
# 2024 and 2025 Form 540 (FTB); line 64 (Side 3, required there) is the one
# planner close relies on; next year's safe harbor reads lines 48, 61 and 62
# (540-ES worksheet line 19b).
form: CA-540
years: [2024, 2025, 2026]
match: ["Form 540 20", "This is your taxable income"]
year_pattern: 'Form 540\s+(20\d\d)'
issuer: CA
boxes:
  "13": {label: "Federal adjusted gross income", pattern: 'Form 1040 or 1040-SR, line 11b?[\s.•]*13\s+AMOUNT'}
  "17": {label: "California adjusted gross income", pattern: 'Combine line 15 and line 16[\s.•]*17\s+AMOUNT'}
  "19": {label: "Taxable income", pattern: 'This is your taxable income\.?[\s.•]*19\s+AMOUNT'}
  "31": {label: "Tax", pattern: 'FTB 3803[\s.•]*31\s+AMOUNT'}
