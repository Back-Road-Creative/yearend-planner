# Virginia Form 760, page 2 (the tax, the Spouse Tax Adjustment, payments and
# credits, the amount owed or the refund). Merges with page 1 (va-760.yaml) as
# form VA-760.
form: VA-760
years: [2025]
match: ["Form 760", "Net Amount of Tax", "Spouse Tax Adjustment (STA)"]
year_pattern: '(20\d\d) Form 760(?![A-Z])'
issuer: VA
boxes:
  "16": {label: "Amount of Tax from Tax Table or Tax Rate Schedule", pattern: 'round to whole dollars\)[\s.]*16\s+AMOUNT', required: true}
  "17": {label: "Spouse Tax Adjustment (STA)", pattern: 'STA amount on Line 17\.\s*17\s+AMOUNT'}
  "18": {label: "Net Amount of Tax", pattern: 'Subtract Line 17 from Line 16[\s.]*18\s+AMOUNT', required: true}
  "19a": {label: "Your Virginia withholding", pattern: 'Your Virginia withholding[\s.]*19a\s+AMOUNT'}
  "19b": {label: "Spouse's Virginia withholding", pattern: 'Filing Status 2 only\)[\s.]*19b\s+AMOUNT'}
  "20": {label: "Estimated tax payments", pattern: 'from Form 760ES\)[\s.]*20\s+AMOUNT'}
  "21": {label: "Overpayment applied toward estimated tax", pattern: 'overpayment applied toward \d{4} estimated tax[\s.]*21\s+AMOUNT'}
  "22": {label: "Extension Payments", pattern: 'from Form 760IP\)[\s.]*22\s+AMOUNT'}
  "23": {label: "Tax Credit for Low-Income Individuals or Earned Income Credit", pattern: 'from Sch\. ADJ, Line 17[\s.]*23\s+AMOUNT'}
  "24": {label: "Credit for Tax Paid to Another State", pattern: 'copy of all other state returns\.[\s.]*24\s+AMOUNT'}
  "25": {label: "Credits from Schedule CR", pattern: 'Section 5, Part 1, Line 1A[\s.]*25\s+AMOUNT'}
  "26": {label: "Add Lines 19a through 25", pattern: 'Add Lines 19a through 25[\s.]*26\s+AMOUNT'}
  "27": {label: "Tax You Owe", pattern: 'This is the Tax You Owe[\s.]*27\s+AMOUNT'}
  "28": {label: "Tax Overpayment", pattern: 'This is Your Tax Overpayment[\s.]*28\s+AMOUNT'}
  "33": {label: "Consumer's Use Tax", pattern: 'no sales and use tax is due[\s.]*33\s+AMOUNT'}
  "35": {label: "Amount You Owe", pattern: 'AMOUNT YOU OWE[\s.]*35\s+AMOUNT'}
  "36": {label: "Your Refund", pattern: 'YOUR REFUND[\s.]*36\s+AMOUNT'}
