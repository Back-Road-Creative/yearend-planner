# Form W-2, IRS box labels: wages, the withholding credited to the installments,
# the Social Security wages and tips (boxes 3 and 7) Schedule SE line 8a takes,
# the dependent care benefits (box 10) Form 2441 line 12 takes, the box 12
# elective deferrals Form 8880 line 2 takes, and the Social Security and Medicare
# tax withheld (boxes 4 and 6) Schedule 8812 line 21 takes, and the code V
# nonstatutory option income the Needed panel's 1099-B basis items look for.
form: W-2
years: [2024, 2025, 2026]
match: ["W-2", "Wage and Tax Statement"]
year_pattern: "(?:Wage and Tax Statement\\s*|tax year\\s*:?\\s*)(20\\d\\d)"
issuer_pattern: "Employer'?s name(?:, address,? and ZIP code)?\\s*:?\\s*([^\\n]+)"
boxes:
  "1": {label: "Wages, tips, other compensation", pattern: "\\b1 Wages, tips, other comp(?:ensation|\\.)\\s+AMOUNT", required: true}
  "2": {label: "Federal income tax withheld", pattern: "\\b2 Federal income tax withheld\\s+AMOUNT", required: true}
  "3": {label: "Social security wages", pattern: "\\b3 Social security wages\\s+AMOUNT"}
  "4": {label: "Social security tax withheld", pattern: "\\b4 Social security tax withheld\\s+AMOUNT"}
  "6": {label: "Medicare tax withheld", pattern: "\\b6 Medicare tax withheld\\s+AMOUNT"}
  "7": {label: "Social security tips", pattern: "\\b7 Social security tips\\s+AMOUNT"}
  "10": {label: "Dependent care benefits", pattern: "\\b10 Dependent care benefits\\s+AMOUNT"}
  "12D": {label: "Box 12 code D: 401(k) elective deferrals", pattern: '\b12[a-d]?\s+(?:Code\s+)?D\s+AMOUNT'}
  "12E": {label: "Box 12 code E: 403(b) elective deferrals", pattern: '\b12[a-d]?\s+(?:Code\s+)?E\s+AMOUNT'}
  "12F": {label: "Box 12 code F: 408(k)(6) SARSEP deferrals", pattern: '\b12[a-d]?\s+(?:Code\s+)?F\s+AMOUNT'}
  "12G": {label: "Box 12 code G: 457(b) deferrals", pattern: '\b12[a-d]?\s+(?:Code\s+)?G\s+AMOUNT'}
  "12H": {label: "Box 12 code H: 501(c)(18)(D) contributions", pattern: '\b12[a-d]?\s+(?:Code\s+)?H\s+AMOUNT'}
  "12S": {label: "Box 12 code S: SIMPLE 408(p) deferrals", pattern: '\b12[a-d]?\s+(?:Code\s+)?S\s+AMOUNT'}
  "12AA": {label: "Box 12 code AA: Roth 401(k) contributions", pattern: '\b12[a-d]?\s+(?:Code\s+)?AA\s+AMOUNT'}
  "12BB": {label: "Box 12 code BB: Roth 403(b) contributions", pattern: '\b12[a-d]?\s+(?:Code\s+)?BB\s+AMOUNT'}
  "12EE": {label: "Box 12 code EE: Roth governmental 457(b) contributions", pattern: '\b12[a-d]?\s+(?:Code\s+)?EE\s+AMOUNT'}
  "12V": {label: "Box 12 code V: income from nonstatutory stock options", pattern: '\b12[a-d]?\s+(?:Code\s+)?V\s+AMOUNT'}
  "12W": {label: "Box 12 code W: employer and payroll HSA contributions", pattern: '\b12[a-d]?\s+(?:Code\s+)?W\s+AMOUNT'}
  "16": {label: "State wages, tips, etc.", pattern: "\\b16 State wages, tips, etc\\.?\\s+AMOUNT"}
  "17": {label: "State income tax", pattern: "\\b17 State income tax\\s+AMOUNT"}
