# Form 1095-A Part III: per month, column A premium, column B SLCSP, column C advance credit.
form: 1095-A
years: [2024, 2025, 2026]
match: ["1095-A"]
year_pattern: "(?:calendar year|tax year|coverage year)\\s*:?\\s*(20\\d\\d)"
issuer_pattern: "Marketplace identifier:?\\s*([^\\n]+)"
boxes:
  "premium_01": {label: "January premium", pattern: "\\b21 January\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_01": {label: "January SLCSP", pattern: "\\b21 January\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2, required: true}
  "aptc_01": {label: "January advance credit", pattern: "\\b21 January\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 3, required: true}
  "premium_02": {label: "February premium", pattern: "\\b22 February\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_02": {label: "February SLCSP", pattern: "\\b22 February\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2}
  "aptc_02": {label: "February advance credit", pattern: "\\b22 February\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 3}
  "premium_03": {label: "March premium", pattern: "\\b23 March\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_03": {label: "March SLCSP", pattern: "\\b23 March\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2}
  "aptc_03": {label: "March advance credit", pattern: "\\b23 March\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 3}
  "premium_04": {label: "April premium", pattern: "\\b24 April\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_04": {label: "April SLCSP", pattern: "\\b24 April\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2}
  "aptc_04": {label: "April advance credit", pattern: "\\b24 April\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 3}
  "premium_05": {label: "May premium", pattern: "\\b25 May\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_05": {label: "May SLCSP", pattern: "\\b25 May\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2}
  "aptc_05": {label: "May advance credit", pattern: "\\b25 May\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 3}
  "premium_06": {label: "June premium", pattern: "\\b26 June\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 1}
  "slcsp_06": {label: "June SLCSP", pattern: "\\b26 June\\s+AMOUNT\\s+AMOUNT\\s+AMOUNT", group: 2}
