[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yearend-planner"
version = "0.1.1"
description = "Year-end tax and retirement planner for Windows: deterministic, local, no LLM at runtime"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Joe Petrucelli", email = "info@backroadcreative.com" }]
dependencies = [
    "policyengine-us>=2.21.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.6",
    "typer>=0.15.0",
    "pdfplumber>=0.11.0",
    "pyzipper>=0.3.6",
    "rapidocr-onnxruntime>=1.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
planner = "planner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["planner"]

[tool.uv]
required-version = ">=0.8"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PTH"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"planner/cli.py" = ["B008"]  # typer.Argument/Option defaults are the typer idiom

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["engine: runs the tax engine (slow, ~1 min cold)"]
