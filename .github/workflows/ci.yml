name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy planner tests
      # Coverage floor on one OS (measured 96% at unit 2f; the floor sits 3 under).
      - run: uv run pytest ${{ matrix.os == 'ubuntu-latest' && '--cov=planner --cov-report=term --cov-fail-under=93' || '' }}
        env:
          PYTHONUTF8: "1"

  # Known-vulnerable dependencies (pip-audit on uv.lock) and secrets anywhere in
  # history (gitleaks, checksum-pinned binary; findings are redacted).
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --extra dev --no-emit-project > "$RUNNER_TEMP/req.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/req.txt" --disable-pip --no-deps
      - name: Secret scan
        env:
          GITLEAKS: "8.28.0"
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS}/gitleaks_${GITLEAKS}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

  # The gate for a release: the zip itself, on a clean Windows machine. Server
  # 2025 shares Windows 11 24H2's build (26100); Server 2022 (20348) is the
  # older line. The required check keeps the name windows-proof on the 2025 leg.
  windows-proof:
    name: ${{ matrix.os == 'windows-2025' && 'windows-proof' || 'windows-proof-2022' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build release zip
        run: uv run --no-project python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-2025'
        with:
          name: yearend-planner-win64
          path: dist/yearend-planner-*-win64.zip
          if-no-files-found: error
      - name: Prove the zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\yearend-planner-*-win64.zip | Select-Object -First 1).FullName
          $inbox = Join-Path $env:RUNNER_TEMP 'synthetic-inbox'
          uv run python scripts/synthetic_inbox.py $inbox
          & scripts\windows_proof.ps1 -Zip $zip -Inbox $inbox
