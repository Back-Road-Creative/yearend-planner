name: release
# Push a tag vX.Y.Z (planner/__init__.py __version__) to run the suite, build
# the Windows zip on a clean Windows machine, prove it with
# scripts/windows_proof.ps1 on Windows Server 2025 and then on Server 2022 (the
# same zip), and attach the zip and its .sha256 to a DRAFT release once both
# pass. Publishing the draft is the human step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Tag matches the version
        shell: pwsh
        run: |
          $v = (Select-String -Path planner/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != planner version $v" }
      - run: uv sync --frozen --extra dev
      - run: uv run pytest
        env:
          PYTHONUTF8: "1"
      - name: Build release zip
        run: uv run --no-project python scripts/build_release.py
        env:
          # the suite above passed at this commit: stamped into each capability record
          PROVEN_COMMIT: ${{ github.sha }}
      - name: Prove the zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\yearend-planner-*-win64.zip | Select-Object -First 1).FullName
          $inbox = Join-Path $env:RUNNER_TEMP 'synthetic-inbox'
          uv run python scripts/synthetic_inbox.py $inbox
          & scripts\windows_proof.ps1 -Zip $zip -Inbox $inbox
      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: dist/yearend-planner-*-win64.zip*
          if-no-files-found: error

  # the exact zip built and proven above, proven again on the older Windows line
  prove-windows-2022:
    needs: release
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Prove the zip
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\yearend-planner-*-win64.zip | Select-Object -First 1).FullName
          $inbox = Join-Path $env:RUNNER_TEMP 'synthetic-inbox'
          uv run python scripts/synthetic_inbox.py $inbox
          & scripts\windows_proof.ps1 -Zip $zip -Inbox $inbox

  draft:
    needs: [release, prove-windows-2022]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/yearend-planner-*-win64.zip | head -n 1)
          gh release create "${{ github.ref_name }}" "$zip" "$zip.sha256" --repo "${{ github.repository }}" --draft --title "${{ github.ref_name }}" --notes "Windows one-folder release. Unzip, right-click the zip > Properties > Unblock first, then double-click planner.cmd."
