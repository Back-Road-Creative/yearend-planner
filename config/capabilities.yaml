  note: "credit hand-worked from Rev. Proc. 2025-25 at 138%, 150%, just under 400%, exactly 400.00% and over it; the credit's FPL is the prior year's (Form 8962 line 4); the 400% line is cut in dollars per IRC 36B(c)(1)(A) and i8962 Worksheet 2 (the engine's own 4.00 edge is corrected: planner.engine.tax.ACA_PTC_LINE), in sweeps and the draft Form 8962 line 5 = 401; a couple married in the year gets the alternative calculation for the year of marriage when it lowers the repayment (unit 3b-4, Pub. 974 Worksheets I-V, its Oak/Cedar example as the test)"
child_dependent_care_credit:
  status: verified
  evidence: implemented
  tests: ["tests/test_form_2441.py"]
  note: "Form 2441 (unit 3c-1): Part II credit for care of a dependent under 13 (the line 8 decimal checked at every table edge) and Part III employer benefits from W-2 box 10, with the i2441 line 14 and line 16 examples as tests; the excluded benefits (line 25) lower the $3,000/$6,000 limit, the care paid with them leaves the credit (line 30) and the excess is wages on Form 1040 line 1e (the engine taxes none of it, so planner.engine.tax.dependent_care works Part III out first). Not counted: a dependent 13 or over, or a spouse, who cannot care for themselves; line 9b (prior-year care) and benefits from your own business (lines 22, 24) are not drafted"
education_credits:
  status: verified
  evidence: implemented
  tests: ["tests/test_form_8863.py"]
  note: "Form 8863 (unit 3c-2): the American opportunity credit per student (Part III lines 27-30), its refundable 40% (line 8, none when the line 7 conditions apply), the lifetime learning credit (lines 10-12) and the shared $80,000-$90,000 ($160,000-$180,000 joint) phase-out, with the i8863 adjusted-expenses examples (a Pell grant applied) and the recapture example as tests; the nonrefundable part goes on Schedule 3 line 3 through the Credit Limit Worksheet. Each student, the expenses paid and the aid are typed per student from the 1098-T; whether a student meets the American opportunity tests (first four years, half time, a credential, no felony drug conviction, not claimed four times) is the filer's answer. Not drafted: Part III lines 20-26 (school names and EINs), recapture of a credit taken in an earlier year, and expenses paid by someone else"
savers_credit:
  status: verified
  evidence: implemented
  tests: ["tests/test_form_8880.py"]
  note: "Form 8880 (unit 3c-3): each spouse's traditional, Roth IRA and ABLE contributions (line 1) and W-2 box 12 elective deferrals (codes D, E, F, G, H, S, AA, BB, EE; line 2), less the testing period's distributions (line 4, never below the year's own IRA distributions), capped at $2,000 per person (line 6), times the line 9 decimal (checked at every edge of the 2025 table for every filing status) and held to the tax by the Credit Limit Worksheet, on Schedule 3 line 4. The age test (born after January 1, 18 years back) comes from the birth date; student and dependent status is the filer's yes or no. The testing period's distributions (two years back to the next filing deadline) are typed, since earlier years' 1099-Rs are not on file"
earned_income_credit:
  status: verified
  evidence: implemented
  tests: ["tests/test_eic.py"]
  note: "1040 line 27a by the EIC worksheet (unit 3c-4): Worksheet A, or B when anyone is self-employed (Schedule SE line 3 less line 13 plus line 1z), the EIC Table on earned income and, when AGI differs and is past the phase-out start, on AGI, the smaller; the table is priced from the engine's parameters and pinned to the printed 2025 rows and footnotes. Steps 1-4: the investment income limit (1040 lines 2a + 2b + 3b + 7a), the 25-64 age band without a child, no credit married filing separately without a child, and the separated-spouse rule noted with one. Qualifying children by age, student and disability (Schedule EIC lines 3-4b); each child's SSN, relationship and months at home are assumed and left to the preparer. Pub. 596 Worksheet 1 (rental or passive income) and the clergy, Medicaid waiver and combat pay rules are not drafted; the engine's eitc is checked against line 27a"
income_1099g_1099c:
