# What the tax engine (policyengine-us) is verified to compute for this planner.
# verified: reference test passes. partial: computes but a reference case fails or
# is untested. unsupported: the planner implements the rule itself from the cited
# worksheet until the engine covers it (never left as a gap, never reported as 0).
