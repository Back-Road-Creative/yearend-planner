  note: "Form 2441 (unit 3c-1): Part II credit for care of a dependent under 13 (the line 8 decimal checked at every table edge) and Part III employer benefits from W-2 box 10, with the i2441 line 14 and line 16 examples as tests; the excluded benefits (line 25) lower the $3,000/$6,000 limit, the care paid with them leaves the credit (line 30) and the excess is wages on Form 1040 line 1e (the engine taxes none of it, so planner.engine.tax.dependent_care works Part III out first). Not counted: a dependent 13 or over, or a spouse, who cannot care for themselves; line 9b (prior-year care) and benefits from your own business (lines 22, 24) are not drafted"
education_credits:
  status: verified
  evidence: implemented
  tests: ["tests/test_form_8863.py"]
  note: "Form 8863 (unit 3c-2): the American opportunity credit per student (Part III lines 27-30), its refundable 40% (line 8, none when the line 7 conditions apply), the lifetime learning credit (lines 10-12) and the shared $80,000-$90,000 ($160,000-$180,000 joint) phase-out, with the i8863 adjusted-expenses examples (a Pell grant applied) and the recapture example as tests; the nonrefundable part goes on Schedule 3 line 3 through the Credit Limit Worksheet. Each student, the expenses paid and the aid are typed per student from the 1098-T; whether a student meets the American opportunity tests (first four years, half time, a credential, no felony drug conviction, not claimed four times) is the filer's answer. Not drafted: Part III lines 20-26 (school names and EINs), recapture of a credit taken in an earlier year, and expenses paid by someone else"
savers_credit:
  status: verified
  evidence: implemented
  tests: ["tests/test_form_8880.py"]
  note: "Form 8880 (unit 3c-3): each spouse's traditional, Roth IRA and ABLE contributions (line 1) and W-2 box 12 elective deferrals (codes D, E, F, G, H, S, AA, BB, EE; line 2), less the testing period's distributions (line 4, never below the year's own IRA distributions), capped at $2,000 per person (line 6), times the line 9 decimal (checked at every edge of the 2025 table for every filing status) and held to the tax by the Credit Limit Worksheet, on Schedule 3 line 4. The age test (born after January 1, 18 years back) comes from the birth date; student and dependent status is the filer's yes or no. The testing period's distributions (two years back to the next filing deadline) are typed, since earlier years' 1099-Rs are not on file"
foreign_tax_credit:
  status: verified
  evidence: implemented
  tests: ["tests/test_form1116.py"]
  note: "Form 1116 (unit 3e-7), passive category income in one column (a fund's foreign income is totaled): foreign tax from 1099-DIV box 7 and 1099-INT box 6; $300 or less ($600 joint) with no carryover takes the election (Schedule 3 line 1, no form); otherwise lines 1a-35 from the typed foreign_source_income, foreign_qualified_dividends and foreign_tax_carryover, line 3a the standard deduction or the real estate taxes' share of capped SALT (CHECK), 3e = 1040 line 9, 4a by the home mortgage worksheet over $5,000, line 18 = taxable income + Sch 1-A line 37, the qualified dividend adjustment (0.4054 / 0.5405) with the Worksheet for Line 18 or the adjustment exception, whichever credit is larger; the credit reprices the engine and the 2441, 8863, 8880 and 8812 limits. Not drafted, named: other categories, K-1/K-3 foreign tax, foreign capital gains (Worksheets A and B), lines 2, 5, 12, 13, 16, 22, 34, the asset method for 4b, Schedules B and C (Form 1116)"
equity_pay:
  status: verified
  evidence: implemented
  tests: ["tests/test_equity_pay.py"]
  note: "Equity pay (unit 3e-8): Forms 3921 and 3922 read by templates 3921.yaml and 3922.yaml (four-decimal prices per share) and W-2 box 12 code V; the Needed panel's iso_amt_adjustment comes from Form 3921 (box 4 - box 3) x box 5 (Pub. 525), stock_option_income is Schedule 1 line 8k (a disqualifying ISO sale or the ordinary part of an ESPP sale, typed with the Pub. 525 rules named), and equity_basis_short/long are Form 8949 code B rows with a negative adjustment (the 1099-B totals move to line 1b or 8b with only summaries). Form 6251 lines 1a-11 from the draft (1a = line 14 - Sch 1-A line 37, 2a the Schedule A taxes or the standard deduction, 2i, the separate-return line 4 rule, the exemption phase-out, 26%/28%, line 8 = Sch 3 line 1), checked against the engine, which now carries the ISO adjustment and the Schedule 1-A add-back. Not drafted, named: lines 2b-2h and 2j-3, Part III lines 12-40, the AMT Form 1116, Form 8801"
digital_assets:
  status: verified
  evidence: implemented
  tests: ["tests/test_digital_assets.py"]
  note: "Digital assets (unit 3e-9): Form 1099-DA read by template 1099-da.yaml, one form per sale (the asset, units and dates join the issuer, so a second sale is not a correction of the first), boxes 1a-1g, 1i, 2, 4, 6 and the Form 8949 letter. A lot whose symbol is a 1099-DA asset or in the typed digital_assets goes to Form 8949 box G/J (matched 1099-DA, box 2 checked), H/K (box 2 blank) or I/L (no 1099-DA), takes the 1099-DA's box 1i as code W and is not wash-sale checked (not a security); a 1099-DA with no lot is its own row with its basis, a blank 1g or unknown term left for you. Schedule D lines 1b, 2, 3, 8b, 9 and 10 sum their boxes, lines 7 and 15 every line. 1099-DA box 4 is 1040 line 25b. The Form 1040 page 1 digital assets question (digital_asset_activity) is derived yes from a 1099-DA, else asked. Not drafted, named: digital assets received as income (Schedule 1 line 8v, Schedule C), Form 709 gifts, tokenized-security wash sales across accounts"
pensions_and_qcd:
  status: verified
  evidence: implemented
  tests: ["tests/test_pensions_qcd.py", "tests/test_simplified_method.py"]
  note: "Pensions and QCDs (unit 3f-1): template 1099-r.yaml reads box 7 and the 2026 form's box 7a code (numbers, letters or both, Y7 included) and box 7b IRA/SEP/SIMPLE (yes when marked, no when the label shows unmarked, either side of the label). A 1099-R is an IRA's when 7b is marked or the code is an IRA's (5 J K N Q R S T Y), a plan's or annuity's when 7b is unmarked or the code is a plan's (A B D E H L M U W 9), an IRA's otherwise (a form read before 7b). IRA box 2a is ira_distributions (Form 1040 4a-4b), plan box 2a is pension_income per person (5a-5b, 5a only when partly taxable; the engine's taxable_private_pension_income). Typed qcd per person, asked with IRA distributions, a 1099-R coded Y named as its lead: left out of 4b at 70 1/2 by year end, no more than the year's limit (Pub. 590-B: $108,000 for 2025, $111,000 for 2026), the taxable IRA amount, less this year's IRA deduction (QCD Adjustment Worksheet); 4c shows box 2 (QCD). Form 8880 line 4 floor counts plan distributions too. Unit 3f-2: a plan 1099-R with box 2a blank or box 2b Taxable amount not determined marked (boxes 5 and 9b read too) asks the typed annuities answer (cost, starting date, recovered, beneficiary's age) and fills the Simplified Method Worksheet (2025 Form 1040 instructions, lines 5a and 5b): line 3 from Table 1 (age at the starting date, before November 19, 1996 or after) or Table 2 (combined ages, joint and survivor starting after 1997), line 8 held to the cost not yet recovered from 1987 on, line 9 added to the owner's 5b, lines 10-11 for next year; box 9b against line 7 is checked. Not handled, named: gifts before the 70 1/2 day in that year, earlier years' deductions on the worksheet, the one-time split-interest gift (box 3 SIE), government pensions apart from private ones (state exclusions), the General Rule (an annuity starting before July 2, 1986, or a nonqualified annuity), the pre-1996 death benefit exclusion, the public safety officer exclusion"
ira_basis:
  status: verified
  evidence: implemented
  tests: ["tests/test_ira_basis.py"]
  note: "Form 8606 Parts I and II (unit 3f-3, planner/taxprep/f8606.py): the typed ira_basis answer (basis, line 2 from last year's line 14; value, line 6, all traditional, SEP and SIMPLE IRAs on December 31; nondeductible, line 1; late, line 4), asked of each spouse with an IRA distribution, a conversion or a traditional contribution. Line 10, the basis over the year-end value plus the year's distributions and conversions, makes lines 11 and 12 tax free: they come off that person's taxable IRA distributions (line 15c) and conversion (line 18) on 1040 line 4b, line 4a keeping the gross; line 14 carries to next year; each spouse's own form (Form 8606 (spouse)). Line 1 comes off the IRA deduction (Schedule 1 line 20) while Form 8880 still counts the whole contribution. Unanswered, everything is taxed in full and noted. Not handled, named: qualified disaster distributions (15b, Form 8915-F), repayments treated as rollovers (the Line 15c Worksheet), Part III (Roth IRA distributions), the Pub. 590-B special computation for a contribution partly deductible under the income limits (type the nondeductible part), returns of contributions, recharacterizations, and the Roth conversion sweep, which prices each candidate as fully taxable"
early_distributions:
  status: verified
  evidence: implemented
  tests: ["tests/test_early_dist.py"]
  note: "Form 5329 Part I (unit 3f-5, planner/taxprep/f5329.py; 2025 Form 5329 and its instructions, 2026 Instructions for Forms 1099-R and 5498): each 1099-R coded 1 (early, no known exception) or S (a SIMPLE IRA in its first 2 years) puts its box 2a on its owner's line 1, an IRA's less the Form 8606 line 10 share, an annuity with box 2a blank its Simplified Method amount when it is the owner's only one. Codes 2, 3 and 4 (a governmental 457(b) not attributable to a rollover is code 2) never reach line 1. The typed early_exception per person (number 01-23 and amount, simple for an S amount; 99 when more than one; 01, 06 and 13 plans only, 07-09 IRAs only, 09 up to 10,000) is line 2; 59 1/2 all year is exception 12 without asking, turning 59 1/2 in the year is noted. Line 4 is 10% of line 3, 25% of its SIMPLE part, to Schedule 2 line 8 and line 21; each spouse's own form (Form 5329 (spouse)). Unanswered, everything is taxed and noted. Not handled, named: Roth IRA early distributions (code J: Form 8606 Part III, line 25c), in-plan Roth rollover recapture, modified endowment contracts, prohibited transactions, qualified disaster recovery distributions (Form 8915-F), the 60-day rollover of a coded distribution (box 2a counted as on line 4b), the first-home 10,000 counted across earlier years, and the levers and withdrawal plan, which the engine prices without the additional tax"
