# What the planner is proven to compute, one record per capability (unit 2b).
#   status    the historical claim. verified: a reference test passes. partial:
#             computes, but a reference case fails or is untested. unsupported:
#             the planner implements the rule itself from the cited worksheet
#             until the engine covers it (never a gap, never reported as 0).
#   evidence  unreviewed, implemented, independently_validated,
#             end_to_end_accepted, partial or out_of_scope. Above implemented
#             needs `expected`; a status never promotes it (finding F13).
#   tests     tests/<file>.py[::<name>] that prove it; each must exist.
#   note      what the tests cover and what they leave out.
#   scope     who it holds for, when narrower than the planner's scope below.
#   expected  the independent expected-value source (an official worked example,
#             Tax-Calculator), never the planner's own formula.
#   proven    the commit a release run proved it at: scripts/build_release.py
#             stamps it into the shipped copy; never typed here.
# The planner's scope: one person, no dependents (planner.coverage.HOUSEHOLD);
# the NC return drafted, other states' income tax estimated; the tax years the
# engine publishes.
federal_income_tax:
  status: verified
  evidence: implemented
  tests: ["tests/test_tax.py", "tests/test_verify.py"]
