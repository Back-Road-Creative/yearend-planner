  note: "the profile names them (unit 3a-2: spouse_birth_date, dependents) and the engine prices the tax unit (unit 3a-1): a joint return's spouse (own wages, SE income, IRA, conversion, Social Security) and dependents (age, full-time student, disabled) are people of the tax unit; hand-worked 2026 joint cases from Rev. Proc. 2025-32 (32,200 standard deduction, Table 1, 2,200 child credit) and the 500 other-dependent credit (IRC 24(h)(4)); each document is one person's (unit 3a-4: data/inbox/spouse/ or planner owner; schema 5 documents.owner; a corrected form supersedes only its owner's copy) and the spouse's own lines are spouse_* answers; the swept input and Medicaid eligibility are the head's; a spouse who died in the year stays on that joint return at their age at death, 65 only if 65 at death (unit 3b-3, Pub. 501); separate returns are 3b"
