federal_ltcg_rates: verified  # tests/test_tax.py (0% band, 15% above)
self_employment_tax: verified  # tests/test_tax.py::test_self_employment_30k
qbi_deduction: verified  # tests/test_tax.py::test_self_employment_30k
nc_income_tax: verified  # tests/test_tax.py (3.99%, 12,750 std), tests/test_verify.py (2025)
aca_premium_tax_credit: partial
aca_slcsp_county: partial
medicaid_expansion_magi: partial
se_health_insurance_deduction: partial
