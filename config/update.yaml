# Where "planner run" looks for a newer release: a GitHub "latest release"
# API address whose release carries yearend-planner-<v>-win64.zip and
# yearend-planner-<v>-win64.zip.sha256. The check sends one GET and no
# personal data. Set PLANNER_UPDATE_FEED=off to turn it off.
feed: https://api.github.com/repos/Back-Road-Creative/yearend-planner/releases/latest
