# Where "planner run" looks for a newer release: a GitHub "latest release"
# API address whose release carries yearend-planner-<v>-win64.zip and
# yearend-planner-<v>-win64.zip.sha256, and .sha256.sig: the publisher's
# Ed25519 signature of the .sha256 file. The check sends one GET and no
# personal data. Set PLANNER_UPDATE_FEED=off to turn it off.
feed: https://api.github.com/repos/Back-Road-Creative/yearend-planner/releases/latest
# The publisher's Ed25519 public key (base64). A release is installed only
# when its .sha256.sig verifies against it; empty holds every release.
# Set once by: python scripts/sign_release.py keygen config/update.yaml
public_key: ""
