# Profile assumptions. Copy is made by the planner into data/profile/assumptions.yaml
# and filled by the intake loop (documents first, typed answers second).
# A field left null is unknown. Unknown is never treated as zero.
birth_date: null          # YYYY-MM-DD; the one fact no document supplies
filing_status: null       # single | married_joint | married_separate | head_of_household
state: null               # two-letter, e.g. NC
county: null              # county, e.g. Macon or Macon County; read from the return's ZIP when one county
spouse_birth_date: null   # YYYY-MM-DD; a joint return's spouse (asked when married_joint)
dependents: null          # [{birth_date: YYYY-MM-DD, student: false, disabled: false}]; [] for none
spending_floor: null      # annual, dollars: the lowest the household can run on
spending_ceiling: null    # annual, dollars: comfortable spending
withdrawal_rate: null     # fraction of investable assets per year, e.g. 0.035
cash_target: null         # dollars of cash buffer to hold; typed, it wins over the rule below
reserve_months: null      # the reserve rule: months of the spending floor to keep in cash
reserve_deductibles: null # the reserve rule: health, home and car deductibles, dollars
mortgage_monthly: null    # P&I plus escrow per month, for the cash line
premium_monthly: null     # health premium per month net of the advance credit
irregular: null           # e.g. [{label: property tax, month: 9, amount: 2400}]; add year: 2026 for a one-off
inflation: null           # fraction per year, e.g. 0.025
return_floor: null        # fraction per year, pessimistic real return
return_track: null        # fraction per year, planning real return
ss_estimate_62: null      # monthly benefit at 62, from the SSA statement
ss_estimate_67: null      # monthly benefit at 67
ss_estimate_70: null      # monthly benefit at 70
ira_access_age: 59.5      # penalty-free IRA access
ss_claim_age: null        # planned claim age
spouse_ss_estimate_62: null  # a joint spouse's own SSA statement (asked when married_joint)
spouse_ss_estimate_67: null
spouse_ss_estimate_70: null
spouse_ss_claim_age: null    # the spouse's planned claim age
conversion_margin: null   # dollars kept below a threshold when sizing a conversion
conversion_cap: null      # hard cap on a single year's Roth conversion, dollars
conversion_objective: null  # ltcg_0pct | bracket_12 | aca_400 | medicaid_under | medicaid_over
roth_basis_contributions: null  # dollars ever contributed to Roth IRAs (not conversions)
hsa_coverage: null        # none | self | family (high-deductible plan this year)
workplace_plan: null      # yes | no: covered by a retirement plan at work this year (W-2 box 13, SEP or solo 401(k))
