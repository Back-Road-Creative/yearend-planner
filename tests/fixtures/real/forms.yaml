# Real-layout fixtures (unit 7h): official blank IRS forms with synthetic values
# printed into their fields by scripts/real_forms.py. url and sha256 pin the
# blank; page is the recipient's copy (Copy B, from 0); fields maps the end of
# a field's full name to the value printed there ("X" marks a check box);
# expect is what the parser must read from the page. Values are synthetic:
# names carry "(synthetic)", TIN and account fields stay blank. A box the
# fields leave blank must not appear in expect: it proves a blank box never
# takes the next box's figure.
forms:
  - name: 1099-int
    url: https://www.irs.gov/pub/irs-pdf/f1099int.pdf
    sha256: ee7697c9b29374596fd9645b157b7312d121ae3c2f76bebf68908c3fc2b739e6
    page: 3
    fields: {".CalendarYear2_1[0]": "2025", ".f2_1[0]": "Example Bank (synthetic)\n100 Main St\nAnytown, NC 27000", ".f2_9[0]": "1,235.00", ".f2_11[0]": "310.00", ".f2_12[0]": "50.00", ".f2_16[0]": "75.00"}
    expect: {"form": "1099-INT", "year": 2025, "issuer": "Example Bank (synthetic)", "boxes": {"1": 1235.0, "3": 310.0, "4": 50.0, "8": 75.0}}
