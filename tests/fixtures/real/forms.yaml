# Real-layout fixtures (unit 7h): official blank IRS and state forms with synthetic values
# printed into their fields by scripts/real_forms.py. url and sha256 pin the
# blank; page is the recipient's copy (Copy B, from 0), or the list of a
# return's pages; fields maps the end of a field's full name to the value
# printed there ("X" marks a check box);
# expect is what the parser must read from the page. Values are synthetic:
# names carry "(synthetic)", TIN and account fields stay blank. A box the
# fields leave blank must not appear in expect: it proves a blank box never
# takes the next box's figure.
